<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
    
  <defs>
    <linearGradient id="antiqueGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6E29F"/>
      <stop offset="35%" stop-color="#D4AF61"/>
      <stop offset="70%" stop-color="#A67C37"/>
      <stop offset="100%" stop-color="#6E4E1E"/>
    </linearGradient>
    <linearGradient id="brightGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4"/>
      <stop offset="50%" stop-color="#E5C168"/>
      <stop offset="100%" stop-color="#9B722C"/>
    </linearGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="45%" stop-color="#CBD5E1"/>
      <stop offset="80%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="pageLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E8DCC4"/>
      <stop offset="45%" stop-color="#FAF4E8"/>
      <stop offset="50%" stop-color="#C8B696"/>
      <stop offset="55%" stop-color="#FAF4E8"/>
      <stop offset="100%" stop-color="#DFD0B5"/>
    </linearGradient>
    <radialGradient id="navySky" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#102A45"/>
      <stop offset="65%" stop-color="#07172B"/>
      <stop offset="100%" stop-color="#030A14"/>
    </radialGradient>
    <radialGradient id="parchmentBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#F7EFE0"/>
      <stop offset="75%" stop-color="#DFCFAF"/>
      <stop offset="100%" stop-color="#C2AE88"/>
    </radialGradient>
    <radialGradient id="burgundyBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#5B131E"/>
      <stop offset="70%" stop-color="#33080E"/>
      <stop offset="100%" stop-color="#190306"/>
    </radialGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

    <!-- Ornate Shield Outer Gold Frame -->
    <path d="M256 26 L432 122 L442 146 L426 174 L440 330 L416 362 L256 486 L96 362 L72 330 L86 174 L70 146 L80 122 Z" fill="url(#antiqueGold)" stroke="#2A1B08" stroke-width="4" filter="url(#dropShadow)"/>
    <path d="M256 44 L416 132 L422 150 L408 176 L420 322 L398 350 L256 464 L114 350 L92 322 L104 176 L90 150 L96 132 Z" fill="url(#navySky)" stroke="url(#brightGold)" stroke-width="4"/>
    <!-- Midnight Dragon Coiling Above Book -->
    <path d="M138 242 C118 175, 165 92, 248 84 C218 62, 255 44, 290 68 C312 48, 344 54, 342 82 C376 74, 396 102, 372 126 C394 148, 384 198, 348 216 C332 192, 310 184, 292 196 C298 166, 272 145, 244 162 C214 180, 224 232, 256 254 Z" fill="#0B2545" stroke="#38BDF8" stroke-width="2.5"/>
    <!-- Dragon Scales & Spikes -->
    <path d="M162 196 Q196 130 264 118 Q318 112 354 156" fill="none" stroke="#60A5FA" stroke-width="3" opacity="0.65"/>
    <!-- Glowing Dragon Eye & Fangs -->
    <polygon points="316,136 338,128 330,144" fill="#E0F2FE"/>
    <path d="M306 168 L314 182 L322 170 L330 184 L338 170" fill="none" stroke="#F8FAFC" stroke-width="3"/>
    <!-- Open Book in Center -->
    
  <g transform="translate(256, 268) scale(0.95)">
    <!-- Book Cover Base -->
    <path d="M-128 32 L-8 40 L8 40 L128 32 L134 44 L10 52 L-10 52 L-134 44 Z" fill="#0E345A" stroke="#D4AF61" stroke-width="2.5"/>
    <path d="M-14 44 C-6 52, 6 52, 14 44" fill="none" stroke="#D4AF61" stroke-width="3.5"/>
    <!-- Lower page stack -->
    <path d="M-124 30 C-82 18, -36 22, 0 38 C36 22, 82 18, 124 30 L118 14 C78 2, 34 8, 0 26 C-34 8, -78 2, -118 14 Z" fill="#D5C4A1" stroke="#8C734B" stroke-width="1.5"/>
    <!-- Main Open Pages -->
    <path d="M-118 16 C-78 -2, -34 4, 0 24 C34 4, 78 -2, 118 16 L108 -54 C72 -70, 32 -62, 0 -40 C-32 -62, -72 -70, -108 -54 Z" fill="url(#pageLight)" stroke="#B59B6D" stroke-width="2"/>
    <line x1="0" y1="-40" x2="0" y2="26" stroke="#A38A5E" stroke-width="2.5"/>
    <!-- Subtle text lines on left page -->
    <path d="M-90 -36 Q-52 -46 -16 -28 M-92 -22 Q-52 -32 -16 -14 M-94 -8 Q-52 -18 -16 0 M-94 6 Q-52 -4 -18 12" fill="none" stroke="#8C7A5B" stroke-width="2" opacity="0.55" stroke-linecap="round"/>
    <!-- Subtle text lines on right page -->
    <path d="M90 -36 Q52 -46 16 -28 M92 -22 Q52 -32 16 -14 M94 -8 Q52 -18 16 0 M94 6 Q52 -4 18 12" fill="none" stroke="#8C7A5B" stroke-width="2" opacity="0.55" stroke-linecap="round"/>
  </g>

    <!-- Dragon Claws Gripping Book -->
    <path d="M136 286 C144 264, 164 264, 168 292 M154 294 C162 272, 180 272, 182 300" fill="none" stroke="#0B2545" stroke-width="10" stroke-linecap="round"/>
    <path d="M376 286 C368 264, 348 264, 344 292 M358 294 C350 272, 332 272, 330 300" fill="none" stroke="#0B2545" stroke-width="10" stroke-linecap="round"/>
    <!-- Typography -->
    <text x="256" y="382" text-anchor="middle" fill="#F8FAFC" font-family="Georgia, serif" font-weight="bold" font-size="26" letter-spacing="2">LEITOR</text>
    <text x="256" y="414" text-anchor="middle" fill="#F6E29F" font-family="Georgia, serif" font-weight="bold" font-size="25" letter-spacing="1.5">MONSTRUOSO</text>
  </svg>