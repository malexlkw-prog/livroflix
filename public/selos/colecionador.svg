<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
    
  <defs>
    <linearGradient id="antiqueGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6E29F"/>
      <stop offset="35%" stop-color="#D4AF61"/>
      <stop offset="70%" stop-color="#A67C37"/>
      <stop offset="100%" stop-color="#6E4E1E"/>
    </linearGradient>
    <linearGradient id="brightGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4"/>
      <stop offset="50%" stop-color="#E5C168"/>
      <stop offset="100%" stop-color="#9B722C"/>
    </linearGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="45%" stop-color="#CBD5E1"/>
      <stop offset="80%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="pageLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E8DCC4"/>
      <stop offset="45%" stop-color="#FAF4E8"/>
      <stop offset="50%" stop-color="#C8B696"/>
      <stop offset="55%" stop-color="#FAF4E8"/>
      <stop offset="100%" stop-color="#DFD0B5"/>
    </linearGradient>
    <radialGradient id="navySky" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#102A45"/>
      <stop offset="65%" stop-color="#07172B"/>
      <stop offset="100%" stop-color="#030A14"/>
    </radialGradient>
    <radialGradient id="parchmentBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#F7EFE0"/>
      <stop offset="75%" stop-color="#DFCFAF"/>
      <stop offset="100%" stop-color="#C2AE88"/>
    </radialGradient>
    <radialGradient id="burgundyBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#5B131E"/>
      <stop offset="70%" stop-color="#33080E"/>
      <stop offset="100%" stop-color="#190306"/>
    </radialGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

    <path d="M256 24 L432 122 L416 344 L256 486 L96 344 L80 122 Z" fill="url(#antiqueGold)" stroke="#1E293B" stroke-width="5" filter="url(#dropShadow)"/>
    <path d="M256 42 L414 132 L400 334 L256 466 L112 334 L98 132 Z" fill="#081526" stroke="url(#brightGold)" stroke-width="4"/>
    <!-- Stack of 5 Horizontal Hardcover Books -->
    <!-- Book 1 (Top - Blue) -->
    <rect x="164" y="132" width="184" height="34" rx="7" fill="#1D4ED8" stroke="url(#brightGold)" stroke-width="3"/>
    <rect x="292" y="136" width="52" height="26" rx="3" fill="#FAF4E8"/>
    <!-- Book 2 (Burgundy) -->
    <rect x="152" y="168" width="204" height="36" rx="7" fill="#7F1D1D" stroke="url(#brightGold)" stroke-width="3"/>
    <rect x="156" y="172" width="54" height="28" rx="3" fill="#FAF4E8"/>
    <!-- Book 3 (Rust Brown) -->
    <rect x="158" y="206" width="196" height="36" rx="7" fill="#9A3412" stroke="url(#brightGold)" stroke-width="3"/>
    <rect x="296" y="210" width="52" height="28" rx="3" fill="#FAF4E8"/>
    <!-- Book 4 (Teal) -->
    <rect x="150" y="244" width="212" height="36" rx="7" fill="#115E59" stroke="url(#brightGold)" stroke-width="3"/>
    <rect x="302" y="248" width="54" height="28" rx="3" fill="#FAF4E8"/>
    <!-- Book 5 (Bottom - Tan/Gold) -->
    <rect x="146" y="282" width="220" height="38" rx="8" fill="#854D0E" stroke="url(#brightGold)" stroke-width="3"/>
    <rect x="152" y="286" width="58" height="30" rx="3" fill="#FAF4E8"/>
    <!-- Shelf Line -->
    <line x1="122" y1="324" x2="390" y2="324" stroke="url(#antiqueGold)" stroke-width="6" stroke-linecap="round"/>
    <!-- Typography -->
    <text x="256" y="384" text-anchor="middle" fill="#F8FAFC" font-family="Georgia, serif" font-weight="bold" font-size="25" letter-spacing="1.5">COLECIONADOR</text>
  </svg>